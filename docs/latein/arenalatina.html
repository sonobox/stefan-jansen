<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<title>Arena Latina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one column "arena at night" — HUD on top, the fight in the middle, answers below. Single dark look by choice. */
:root {
  --bg: #17182b;
  --bg2: #1f2140;
  --panel: #282b52;
  --panel2: #323667;
  --line: #43477e;
  --ink: #f4efe2;
  --muted: #a9abd0;
  --gold: #f3c34f;
  --gold-ink: #2a1f00;
  --red: #e8554e;
  --green: #45c48f;
  --blue: #6aa8ff;
  --violet: #b78cff;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  background-image: radial-gradient(1200px 500px at 50% -200px, #2e2f63 0%, transparent 70%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-block: 6px 14px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .08em; color: var(--gold); background: none; border: 0; padding: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 5px; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: .9rem; font-variant-numeric: tabular-nums; }
.chip.gold { color: var(--gold); }
.chip.fire { color: #ff9a4d; }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; background: var(--panel2); border: 1px solid var(--line); transition: transform .08s, background .15s; text-align: left; }
.btn:hover { background: #3c4178; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.btn.primary:hover { background: #ffd370; }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn.ghost { background: transparent; }
.btn.big { font-size: 1.1rem; padding: 16px 22px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.center { text-align: center; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }

/* hero / player card */
.player { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.crest { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 2.2rem; background: radial-gradient(circle at 35% 30%, #ffe29a, #c48a1c 70%); box-shadow: 0 0 0 4px #5a3e0a, 0 6px 18px #0008; }
.lvl { font-family: var(--font-display); font-weight: 800; color: var(--gold); }
.bar { height: 12px; border-radius: 999px; background: #0007; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--blue)); border-radius: 999px; transition: width .5s; }
.bar.hp > i { background: linear-gradient(90deg, #ff7a5c, var(--red)); }
.bar.green > i { background: linear-gradient(90deg, #7fe0b2, var(--green)); }

.menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.menu .btn { display: grid; gap: 2px; padding: 16px; }
.menu .btn b { font-family: var(--font-display); font-size: 1.05rem; }
.menu .btn span { font-weight: 600; color: var(--muted); font-size: .88rem; }
.menu .btn.primary span { color: #4b3a08; }
.menu .wide { grid-column: 1 / -1; }
@media (max-width: 460px) { .menu { grid-template-columns: minmax(0, 1fr); } }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.week div { display: grid; gap: 3px; justify-items: center; font-size: .78rem; color: var(--muted); }
.week i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #0005; border: 1px dashed var(--line); font-style: normal; }
.week .on i { background: #ff8a3d; border: 0; color: #2b1100; font-weight: 800; }
.week .today i { outline: 2px solid var(--gold); outline-offset: 2px; }

/* lesson grid */
.lgroup { display: grid; gap: 8px; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.ltile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; display: grid; justify-items: center; gap: 2px; }
.ltile:hover { background: var(--panel2); }
.ltile .n { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.ltile .m { font-size: 1.5rem; line-height: 1; }
.ltile .s { font-size: .8rem; letter-spacing: 1px; color: var(--gold); min-height: 1em; }
.ltile.boss { border-color: #8a5a10; background: linear-gradient(#3b2f2a, var(--panel)); }
.mini { height: 4px; width: 80%; border-radius: 4px; background: #0006; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--green); }
.search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font: inherit; }

.wordlist { display: grid; gap: 4px; max-height: 46vh; overflow: auto; padding-right: 4px; }
.word { display: grid; grid-template-columns: 14px minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid #ffffff10; }
.word b { font-weight: 800; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* battle */
.arena { position: relative; border-radius: 18px; padding: 14px; background: linear-gradient(180deg, #2a2c5a 0%, #23244a 60%, #3a2f2a 60.5%, #2b2320 100%); border: 1px solid var(--line); overflow: hidden; }
.arena .fighters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: end; }
.fighter { display: grid; gap: 6px; min-width: 0; }
.fighter .sprite { font-size: 4.2rem; line-height: 1; text-align: center; filter: drop-shadow(0 8px 6px #0008); transition: transform .15s; user-select: none; }
.fighter.me .sprite { font-size: 3.4rem; }
.fighter .name { font-family: var(--font-display); font-weight: 800; font-size: .95rem; text-align: center; overflow-wrap: anywhere; }
.fighter .name small { display: block; font-family: var(--font-body); font-weight: 600; color: var(--muted); font-size: .78rem; }
.hearts { text-align: center; letter-spacing: 2px; font-size: 1.1rem; min-height: 1.4em; }
.shake { animation: shake .4s; }
.hit { animation: hit .45s; }
.lunge { animation: lunge .35s; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(5px) } }
@keyframes hit { 0% { transform: scale(1) } 30% { transform: scale(.85) rotate(-8deg); filter: brightness(2) } 100% { transform: scale(1) } }
@keyframes lunge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(26px) scale(1.1) } }
.float { position: absolute; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; pointer-events: none; animation: floatup 1s forwards; text-shadow: 0 2px 0 #000a; }
@keyframes floatup { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-50px) } }
.combo { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 800; color: var(--gold); font-size: .95rem; white-space: nowrap; }
.flash { position: fixed; inset: 0; pointer-events: none; background: var(--red); opacity: 0; animation: flash .35s; z-index: 30; }
@keyframes flash { 30% { opacity: .22 } 100% { opacity: 0 } }

.qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.qtype { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 800; }
.qprompt { font-size: 1.15rem; font-weight: 600; }
.qword { font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: var(--gold); overflow-wrap: anywhere; line-height: 1.15; }
.qword.de { font-family: var(--font-body); color: var(--ink); font-size: 1.45rem; }
.qhint { font-size: .9rem; color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 2px solid var(--line); font-weight: 700; text-align: left; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: baseline; }
.opt kbd { font-family: var(--font-body); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.opt:hover:not([disabled]) { border-color: var(--blue); }
.opt.right { border-color: var(--green); background: #1d4a3b; }
.opt.wrong { border-color: var(--red); background: #5a2427; }
.opt[disabled] { cursor: default; }
.answer { display: flex; gap: 8px; }
.answer input { flex: 1; min-width: 0; padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg2); color: var(--ink); font: inherit; font-size: 1.15rem; font-weight: 700; }
.answer input:focus { border-color: var(--gold); outline: none; }
.answer.multi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.answer.multi .btn { grid-column: 1 / -1; }
@media (max-width: 520px) { .answer.multi { grid-template-columns: minmax(0, 1fr); } }
.answer input.ok { border-color: var(--green); }
.answer input.close { border-color: var(--gold); }
.answer input.bad { border-color: var(--red); }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.fb.ok { background: #1d4a3b; border: 1px solid var(--green); }
.fb.close { background: #4a4119; border: 1px solid var(--gold); }
.fb.bad { background: #5a2427; border: 1px solid var(--red); }
.fb b.big { font-family: var(--font-display); font-size: 1.1rem; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { min-width: 42px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; display: grid; place-items: center; padding: 0 8px; }
.tile.used { visibility: hidden; }
.slots { min-height: 52px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; border-radius: 12px; background: var(--bg2); border: 2px dashed var(--line); font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--gold); letter-spacing: .06em; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match .opt.sel { border-color: var(--gold); background: #4a4119; }
.match .opt.done { opacity: .25; border-color: var(--green); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* overlays */
.overlay { position: fixed; inset: 0; background: #0b0c1acc; display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 440px; width: 100%; display: grid; gap: 14px; text-align: center; max-height: 90vh; overflow: auto; }
.modal .bigicon { font-size: 3.4rem; line-height: 1; }
.pop { animation: pop .4s; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: scale(1); opacity: 1 } }
.reward-list { display: grid; gap: 6px; text-align: left; }
.reward-list div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; background: var(--bg2); border-radius: 8px; }
.chest { font-size: 4rem; background: none; border: 0; line-height: 1; animation: wobble 1.2s infinite; }
@keyframes wobble { 0%,100% { transform: rotate(0) } 10% { transform: rotate(-8deg) } 20% { transform: rotate(8deg) } 30% { transform: rotate(0) } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gold); color: var(--gold-ink); font-weight: 800; padding: 10px 16px; border-radius: 12px; z-index: 50; box-shadow: 0 6px 20px #0008; max-width: calc(100% - 32px); text-align: center; }

/* shop, badges */
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.item { display: grid; gap: 8px; align-content: space-between; }
.item .ic { font-size: 2rem; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { text-align: center; display: grid; gap: 4px; justify-items: center; }
.badge .ic { font-size: 2.1rem; }
.badge.off { opacity: .35; filter: grayscale(1); }
.toggle { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.toggle button.on { background: var(--blue); color: #0a1530; border-color: transparent; }
.memory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mcard { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; border: 2px solid var(--line); background: repeating-linear-gradient(45deg, #2e3266 0 8px, #282b58 8px 16px); display: grid; place-items: center; padding: 6px; font-weight: 800; font-size: .85rem; overflow-wrap: anywhere; text-align: center; }
.mcard.open { background: var(--panel2); }
.mcard.open.la { color: var(--gold); font-family: var(--font-display); font-size: .95rem; }
.mcard.gone { opacity: .25; border-color: var(--green); }
@media (max-width: 420px) { .memory { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

document.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-close]");
  if (!t) return;
  const d = t.dataset;
  if (d.close) { if (!t.matches("button") && ev.target !== t) return; closeSheet(); return; }
  if (d.go) { if (view === "blitz" && ui.blitz) clearInterval(ui.blitz.timer); sheet = null; view = d.go; render(); return; }
  if (d.lesson) { openSheet(lessonSheet(+d.lesson)); return; }
  if (d.start) { sheet = null; ui.last = { mode: "lesson", l: +d.start }; newBattle("lesson", { l: +d.start }); return; }
  if (d.buy) { const it = SHOP().find(x => x.id === d.buy); if (it && !it.max && S.coins >= it.price) { S.coins -= it.price; it.buy(); save(); sound("coin"); toast(`${it.name} gekauft!`); checkBadges(); render(); } return; }
  if (d.tog) { const arr = S.settings[d.tog]; const i = arr.indexOf(d.val); if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(d.val); save(); render(); return; }
  if (d.fverb) { ui.fverbs.has(d.fverb) ? ui.fverbs.delete(d.fverb) : ui.fverbs.add(d.fverb); render(); return; }
  if (d.fdecl) { ui.fdecl.has(d.fdecl) ? ui.fdecl.delete(d.fdecl) : ui.fdecl.add(d.fdecl); render(); return; }
  if (d.blitz) return blitzAnswer(d.blitz === "1");
  if (d.mem) return memFlip(+d.mem);
  if (view === "battle" && B) {
    if (d.opt != null && B.state === "ask") { const o = B.q.opts[+d.opt]; ui.chosen = +d.opt; return resolve(o.ok ? "right" : "wrong", o.text); }
    if (d.tf != null && B.state === "ask") { ui.chosen = null; return resolve((d.tf === "1") === B.q.truth ? "right" : "wrong", d.tf === "1" ? "Stimmt" : "Stimmt nicht"); }
    if (d.tile != null && B.state === "ask") { const i = +d.tile; if (!ui.letters.includes(i)) { ui.letters.push(i); if (ui.letters.length === B.q.letters.length) { const w = ui.letters.map(k => B.q.letters[k]).join(""); return resolve(w === B.q.target ? "right" : "wrong", w); } renderBattle(); } return; }
    if (d.ml && B.state === "ask") { B.q.sel = d.ml; renderBattle(); return; }
    if (d.mr && B.state === "ask") return matchPick(d.mr);
  }
  switch (d.act) {
    case "next": return cont();
    case "undo": ui.letters.pop(); return renderBattle();
    case "clear": ui.letters = []; return renderBattle();
    case "flee": if (B) { B.monster.hp > 0 && finish(false); } return;
    case "giveup": return finish(false);
    case "potion": S.potions--; B.hearts = Math.min(B.maxHearts, 3); B.potionUsed++; save(); nextQ(); renderBattle(); return;
    case "review": ui.last = { mode: "review" }; return newBattle("review");
    case "again": return ui.last ? (ui.last.mode === "forms" ? newBattle("forms", ui.last.opts) : newBattle(ui.last.mode, ui.last)) : (view = "lessons", render());
    case "chest": ui.result.chestText = openChest(); ui.result.chest = false; render(); return;
    case "sound": S.settings.sound = !S.settings.sound; save(); render(); return;
    case "forms": S.settings.forms = !S.settings.forms; save(); render(); return;
    case "decl": S.settings.decl = !S.settings.decl; save(); render(); return;
    case "reset1": ui.reset = true; render(); return;
    case "reset0": ui.reset = false; render(); return;
    case "reset2": { const keep = S.settings; S = DEFAULTS(); S.settings = keep; ui.reset = false; save(); view = "home"; render(); toast("Fortschritt gelöscht"); return; }
    case "formsgo": {
      const verbs = VERBS.filter(v => ui.fverbs.has(v.id) && allowedRows(v).length);
      const nouns = VOC.filter(e => e.dk && e.l <= ui.fmax && ui.fdecl.has(e.k));
      const opts = { verbs, nouns }; ui.last = { mode: "forms", opts }; return newBattle("forms", opts);
    }
    case "blitz": return startBlitz();
    case "memory": return startMemory();
  }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (view !== "battle" || !B || B.state !== "ask" || B.q.kind !== "input") return;
  const vals = [...document.querySelectorAll("[data-ans]")].map(i => i.value);
  if (!vals.some(v => v.trim())) return;
  if (vals.length === 1) return resolve(checkAnswer(vals[0], B.q.targets, B.q.strict), vals[0]);
  const m = checkMulti(vals, B.q.targets, B.q.strict);
  resolve(m.result, vals.filter(v => v.trim()).join("; "), { givenList: vals, marks: m.marks, hits: m.hits, of: vals.length });
});
/** Each field must match a different target; exact matches are assigned first. */
function checkMulti(vals, targets, strict) {
  const free = new Set(targets.map((_, i) => i)), marks = vals.map(() => "bad");
  for (const pass of ["right", "close"]) vals.forEach((v, i) => {
    if (marks[i] !== "bad" || !v.trim()) return;
    for (const j of free) if (checkAnswer(v, [targets[j]], strict) === pass) { marks[i] = pass === "right" ? "ok" : "close"; free.delete(j); break; }
  });
  const hits = marks.filter(m => m !== "bad").length;
  const result = hits === vals.length ? (marks.includes("close") ? "close" : "right") : hits ? "partial" : "wrong";
  return { result, marks, hits };
}
document.addEventListener("input", ev => {
  if (ev.target.id === "nm") { S.name = ev.target.value.slice(0, 20); save(); }
  if (ev.target.id === "fmax") { ui.fmax = +ev.target.value; render(); const r = $("#fmax"); r && r.focus({ preventScroll: true }); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheet) { closeSheet(); return; }
  if (view === "blitz" && ui.blitz && !ui.blitz.over) { if (ev.key === "ArrowLeft") blitzAnswer(true); if (ev.key === "ArrowRight") blitzAnswer(false); return; }
  if (view !== "battle" || !B) return;
  if (B.state === "feedback" && ev.key === "Enter") { ev.preventDefault(); cont(); return; }
  if (B.state !== "ask") return;
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.ans != null) {
    const next = document.querySelector(`[data-ans="${+ev.target.dataset.ans + 1}"]`);
    if (next) { ev.preventDefault(); next.focus(); return; }
  }
  if (B.q.kind === "mc" && /^[1-6]$/.test(ev.key)) { const b = document.querySelector(`[data-opt="${+ev.key - 1}"]`); b && b.click(); }
  if (B.q.kind === "tf" && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) { document.querySelector(`[data-tf="${ev.key === "ArrowLeft" ? 1 : 0}"]`).click(); }
  if (B.q.kind === "letters") {
    if (ev.key === "Backspace") { ui.letters.pop(); renderBattle(); return; }
    if (ev.key.length === 1) { const k = ev.key.toLowerCase(); const i = B.q.letters.findIndex((c, j) => c === k && !ui.letters.includes(j)); if (i >= 0) document.querySelector(`[data-tile="${i}"]`).click(); }
  }
});
function matchPick(rid) {
  const q = B.q; if (!q.sel) { toast("Tippe zuerst links ein lateinisches Wort an"); return; }
  const left = q.sel; q.sel = null;
  if (left === rid) {
    q.done.add(rid); grade(rid, true);
    B.combo++; B.maxCombo = Math.max(B.maxCombo, B.combo); B.correct++; S.stats.correct++; S.today.correct++;
    const { d, crit } = damage(q.power); B.monster.hp = Math.max(0, B.monster.hp - d); B.xp += 6; B.coins += 1;
    fx("hit", d, crit); sound("hit");
    if (q.done.size === q.pairs.length || B.monster.hp <= 0) {
      B.fb = { result: "right", given: "", solution: q.pairs.map(e => `${e.la} = ${shortDe(e)}`).join(" · ") }; B.state = "feedback";
    }
  } else {
    q.errors++; grade(left, false); B.missed.add(left); B.combo = 0; B.wrong++; S.stats.wrong++;
    B.retry.push({ id: left, at: B.n + 2 });
    if (q.errors >= 2) { if (B.shield > 0) { B.shield--; fx("block"); } else { B.hearts--; fx("hurt"); } q.errors = 0; sound("hurt"); }
    else { toast("Passt nicht. Beim nächsten Fehler schlägt das Monster zu!"); }
    if (B.hearts <= 0) { B.state = "down"; }
  }
  save(); renderBattle();
}
function startBlitz() {
  if (S.tickets < 1) return; S.tickets--; S.stats.minigames++; save();
  const pool = gamePool();
  ui.blitz = { pool, score: 0, miss: 0, left: 45, over: false, last: null };
  blitzNext(); view = "blitz"; render();
  ui.blitz.timer = setInterval(() => {
    const g = ui.blitz; if (!g || view !== "blitz") return clearInterval(g && g.timer);
    g.left--; if (g.left <= 0) { clearInterval(g.timer); g.over = true; S.coins += g.score * 2; checkBadges(); save(); sound("win"); }
    render();
  }, 1000);
}
function blitzAnswer(said) {
  const g = ui.blitz; if (!g || g.over) return;
  const ok = said === g.cur.truth;
  if (ok) { g.score++; sound("coin"); } else { g.miss++; sound("hurt"); }
  g.last = { ok, text: `${g.cur.la} = ${shortDe(g.cur.e)}` };
  blitzNext(); render();
}
function startMemory() {
  if (S.tickets < 1) return; S.tickets--; S.stats.minigames++; save();
  const pool = gamePool(); const six = [];
  const used = new Set();
  for (const e of shuffle(pool)) { const k = norm(shortDe(e)); if (used.has(k) || used.has(norm(e.la))) continue; used.add(k); used.add(norm(e.la)); six.push(e); if (six.length === 6) break; }
  const cards = shuffle(six.flatMap(e => [{ id: e.id, text: e.la, la: true }, { id: e.id, text: meanings(e)[0] }]));
  ui.mem = { cards, open: [], gone: new Set(), moves: 0, reward: 0 };
  view = "memory"; render();
}
function memFlip(i) {
  const g = ui.mem; if (g.gone.has(i) || g.open.includes(i) || g.lock) return;
  g.open.push(i);
  if (g.open.length === 2) {
    g.moves++; const [a, b] = g.open;
    if (g.cards[a].id === g.cards[b].id) { g.gone.add(a); g.gone.add(b); g.open = []; sound("coin");
      if (g.gone.size === g.cards.length) { g.reward = Math.max(10, 40 - Math.max(0, g.moves - 6) * 2); S.coins += g.reward; checkBadges(); save(); sound("win"); }
    } else { g.lock = true; setTimeout(() => { g.open = []; g.lock = false; render(); }, 900); }
  }
  render();
}

/* ---------- boot ---------- */
S = loadLocal() || DEFAULTS();
rollDay();
render();
initCloud();
</script>
